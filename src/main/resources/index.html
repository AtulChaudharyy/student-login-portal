<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #333333;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: bold;
            color: #444444;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form action="/register" method="post">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" name="studentName" required placeholder="Enter full name">

            <label for="rollNumber">Roll Number</label>
            <input type="text" id="rollNumber" name="rollNumber" required placeholder="Enter roll number">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter email address">

            <label for="course">Course</label>
            <input type="text" id="course" name="course" required placeholder="Enter course name">

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
